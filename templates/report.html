<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Report Incident | DIVYA AI</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<link rel="stylesheet"
href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body class="dashboard-body">

<div class="d-flex">

<!-- Sidebar -->

<div class="sidebar">

<div class="text-center py-4">

<img src="{{ url_for('static', filename='images/divya-logo.png') }}"
class="sidebar-logo">

<h4 class="text-white mt-3">

DIVYA <span class="text-warning">AI</span>

</h4>

</div>

<ul class="nav flex-column">

<li><a href="dashboard.html"><i class="bi bi-grid-fill"></i> Dashboard</a></li>

<li><a class="active" href="report.html"><i class="bi bi-exclamation-triangle-fill"></i> Report Incident</a></li>

<li><a href="chatbot.html"><i class="bi bi-robot"></i> Ask DIVYA</a></li>

<li><a href="#"><i class="bi bi-shield-check"></i> Safety Guidance</a></li>

<li><a href="#"><i class="bi bi-person-circle"></i> Profile</a></li>

</ul>

</div>

<!-- Main Content -->

<div class="main-content">

<nav class="dashboard-nav">

<h3> Report an Incident</h3>

</nav>

<div class="container-fluid mt-4">

<div class="dashboard-card">

<form>

<div class="row">

<!-- LEFT -->

<div class="col-lg-7">

<div class="mb-4">

<label class="form-label">

Incident Type

</label>

<select class="form-select">

<option>Select Incident</option>

<option>Flood</option>

<option>Fire</option>

<option>Earthquake</option>

<option>Landslide</option>

<option>Cyclone</option>

<option>Road Damage</option>

<option>Building Collapse</option>

<option>Other</option>

</select>

</div>

<div class="mb-4">

<label class="form-label">

Description

</label>

<textarea
class="form-control"
rows="6"
placeholder="Describe what happened..."></textarea>

</div>

<div class="mb-4">

<label class="form-label">

Location

</label>

<input
type="text"
class="form-control"
placeholder="Enter Location">

</div>

<div class="row">

<div class="col-md-6 mb-4">

<label>Date</label>

<input
type="date"
class="form-control">

</div>

<div class="col-md-6 mb-4">

<label>Time</label>

<input
type="time"
class="form-control">

</div>

</div>

</div>

<!-- RIGHT -->

<div class="col-lg-5">

<div class="upload-box">

<i class="bi bi-cloud-arrow-up-fill"></i>

<h5>

Upload Image

</h5>

<p>

PNG, JPG or JPEG

</p>

<input
type="file"
class="form-control">

</div>

<div class="mt-4">

<label>Severity</label>

<select class="form-select">

<option>Low</option>

<option>Medium</option>

<option>High</option>

<option>Critical</option>

</select>

</div>

<div class="mt-4">

<button
class="btn btn-warning w-100">

<i class="bi bi-cpu-fill"></i>

Analyze using AI

</button>

</div>

<div class="mt-3">

<button
class="btn btn-success w-100">

<i class="bi bi-send-fill"></i>

Submit Report

</button>

</div>

</div>

</div>

</form>

</div>

<!-- AI RESULT -->

<div class="dashboard-card mt-4">

<h4>

 AI Analysis Result

</h4>

<div class="row mt-4">

<div class="col-md-3">

<div class="analysis-box">

<h6>

Disaster Type

</h6>

<h4>

Flood

</h4>

</div>

</div>

<div class="col-md-3">

<div class="analysis-box">

<h6>

Confidence

</h6>

<h4>

96%

</h4>

</div>

</div>

<div class="col-md-3">

<div class="analysis-box">

<h6>

Risk Level

</h6>

<h4 class="text-danger">

High

</h4>

</div>

</div>

<div class="col-md-3">

<div class="analysis-box">

<h6>

Recommendation

</h6>

<h4>

Evacuate

</h4>

</div>

</div>

</div>

</div>

</div>

</div>

</div>

<script src="../static/js/script.js"></script>

</body>

</html>
