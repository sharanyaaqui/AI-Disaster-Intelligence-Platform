<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | DIVYA AI</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="../static/css/style.css">

</head>

<body class="login-body">

<div class="container">

<div class="row justify-content-center align-items-center min-vh-100">

<div class="col-lg-10">

<div class="login-card shadow-lg">

<div class="row g-0">

<!-- LEFT SIDE -->

<div class="col-md-6 login-left">

<img src="../static/images/divya-logo.png"
class="login-logo"
alt="DIVYA AI">

<h2 class="mt-4">

DIVYA <span class="text-warning">AI</span>

</h2>

<p class="mt-3">

Disaster Intelligence,<br>
Vigilance & Assistance

</p>

<div class="mt-4">

<div class="feature-item">

<i class="bi bi-shield-check"></i>

AI Powered Safety

</div>

<div class="feature-item">

<i class="bi bi-geo-alt-fill"></i>

Citizen Reporting

</div>

<div class="feature-item">

<i class="bi bi-robot"></i>

Ask DIVYA Assistant

</div>

</div>

</div>

<!-- RIGHT SIDE -->

<div class="col-md-6 login-right">

<h2 class="mb-4">

Welcome Back 👋

</h2>

<p class="text-muted mb-4">

Login to continue to DIVYA AI

</p>

<form>

<div class="mb-3">

<label>Email Address</label>

<input
type="email"
class="form-control"
placeholder="Enter your email">

</div>

<div class="mb-3">

<label>Password</label>

<input
type="password"
class="form-control"
placeholder="Enter password">

</div>

<div class="d-flex justify-content-between mb-4">

<div>

<input
type="checkbox">

Remember Me

</div>

<a href="#">

Forgot Password?

</a>

</div>

<button
class="btn btn-warning w-100 py-2">

<i class="bi bi-box-arrow-in-right"></i>

Login

</button>

<p class="text-center mt-4">

Don't have an account?

<a href="register.html">

Create Account

</a>

</p>

</form>

</div>

</div>

</div>

</div>

</div>

</div>

<script src="../static/js/script.js"></script>

</body>

</html>
