<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account | DIVYA AI</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="../static/css/style.css">

</head>

<body class="login-body">

<div class="container">

<div class="row justify-content-center align-items-center min-vh-100">

<div class="col-lg-11">

<div class="login-card shadow-lg">

<div class="row g-0">

<!-- LEFT PANEL -->

<div class="col-md-5 login-left">

<img src="../static/images/divya-logo.png"
class="login-logo"
alt="DIVYA AI">

<h2 class="mt-4">

DIVYA <span class="text-warning">AI</span>

</h2>

<p class="mt-3">

Disaster Intelligence,<br>
Vigilance & Assistance

</p>

<hr class="border-light my-4">

<div class="feature-item">

<i class="bi bi-shield-check"></i>

AI Disaster Prediction

</div>

<div class="feature-item">

<i class="bi bi-geo-alt-fill"></i>

Citizen Incident Reporting

</div>

<div class="feature-item">

<i class="bi bi-broadcast-pin"></i>

Offline Emergency Alerts

</div>

<div class="feature-item">

<i class="bi bi-robot"></i>

Ask DIVYA Assistant

</div>

</div>

<!-- RIGHT PANEL -->

<div class="col-md-7 login-right">

<h2>Create Your Account</h2>

<p class="text-muted mb-4">

Join DIVYA AI and help build safer communities.

</p>

<form>

<div class="row">

<div class="col-md-6 mb-3">

<label>First Name</label>

<input
type="text"
class="form-control"
placeholder="First Name">

</div>

<div class="col-md-6 mb-3">

<label>Last Name</label>

<input
type="text"
class="form-control"
placeholder="Last Name">

</div>

</div>

<div class="mb-3">

<label>Email Address</label>

<input
type="email"
class="form-control"
placeholder="Enter Email">

</div>

<div class="row">

<div class="col-md-6 mb-3">

<label>Password</label>

<input
type="password"
class="form-control"
placeholder="Create Password">

</div>

<div class="col-md-6 mb-3">

<label>Confirm Password</label>

<input
type="password"
class="form-control"
placeholder="Confirm Password">

</div>

</div>

<div class="mb-3">

<label>Phone Number</label>

<input
type="tel"
class="form-control"
placeholder="+91XXXXXXXXXX">

</div>

<div class="mb-3">

<label>Select Language</label>

<select class="form-select">

<option>English</option>

<option>हिन्दी</option>

</select>

</div>

<div class="form-check mb-4">

<input
class="form-check-input"
type="checkbox"
id="terms">

<label
class="form-check-label"
for="terms">

I agree to the Terms & Conditions

</label>

</div>

<button
class="btn btn-warning w-100 py-2">

<i class="bi bi-person-plus-fill"></i>

Create Account

</button>

<p class="text-center mt-4">

Already have an account?

<a href="login.html">

Login

</a>

</p>

</form>

</div>

</div>

</div>

</div>

</div>

</div>

<script src="../static/js/script.js"></script>

</body>

</html>
