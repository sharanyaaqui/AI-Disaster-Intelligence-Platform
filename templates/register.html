<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account | DIVYA AI</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet"
href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body class="login-body">

<div class="container">

<div class="row justify-content-center align-items-center min-vh-100">

<div class="col-lg-11">

<div class="login-card shadow-lg">

<div class="row g-0">

<!-- LEFT PANEL -->

<div class="col-md-5 login-left">

<img src="{{ url_for('static', filename='images/divya-logo.png') }}"
class="login-logo"
alt="DIVYA AI">

<h2 class="mt-4">

DIVYA <span class="text-warning">AI</span>

</h2>

<p class="mt-3">

Disaster Intelligence,<br>
Vigilance & Assistance

</p>

<hr class="border-light my-4">

<div class="feature-item">

<i class="bi bi-shield-check"></i>

AI Disaster Prediction

</div>

<div class="feature-item">

<i class="bi bi-geo-alt-fill"></i>

Citizen Incident Reporting

</div>

<div class="feature-item">

<i class="bi bi-broadcast-pin"></i>

Offline Emergency Alerts

</div>

<div class="feature-item">

<i class="bi bi-robot"></i>

Ask DIVYA Assistant

</div>

</div>

<!-- RIGHT PANEL -->

<div class="col-md-7 login-right">

<h2>Create Your Account</h2>

<p class="text-muted mb-4">

Join DIVYA AI and help build safer communities.

</p>

<form id="registerForm">

    <div class="row">

        <div class="col-md-6 mb-3">

            <label>First Name</label>

            <input
                type="text"
                class="form-control"
                placeholder="First Name"
                name="firstname"
                id="firstname"
                required>

        </div>

        <div class="col-md-6 mb-3">

            <label>Last Name</label>

            <input
                type="text"
                class="form-control"
                placeholder="Last Name"
                name="lastname"
                id="lastname"
                required>

        </div>

    </div>


    <div class="mb-3">

        <label>Email Address</label>

        <input
            type="email"
            class="form-control"
            placeholder="Enter Email"
            name="email"
            id="email"
            required>

    </div>


    <div class="row">

        <div class="col-md-6 mb-3">

            <label>Password</label>

            <input
                type="password"
                class="form-control"
                placeholder="Create Password"
                name="password"
                id="password"
                required>

        </div>

        <div class="col-md-6 mb-3">

            <label>Confirm Password</label>

            <input
                type="password"
                class="form-control"
                placeholder="Confirm Password"
                name="confirm_password"
                id="confirm_password"
                required>

        </div>

    </div>


    <div class="mb-3">

        <label>Phone Number</label>

        <input
            type="tel"
            class="form-control"
            placeholder="+91XXXXXXXXXX"
            name="tel"
            id="tel"
            required>

    </div>


    <div class="mb-3">

        <label>Select Language</label>

        <select
            class="form-select"
            name="language"
            id="language">

            <option value="en">English</option>
            <option value="hi">हिन्दी</option>

        </select>

    </div>


    <div class="form-check mb-4">

        <input
            class="form-check-input"
            type="checkbox"
            id="terms"
            required>

        <label
            class="form-check-label"
            for="terms">

            I agree to the Terms & Conditions

        </label>

    </div>


    <button
        type="submit"
        class="btn btn-warning w-100 py-2">

        <i class="bi bi-person-plus-fill"></i>

        Create Account

    </button>


    <p class="text-center mt-4">

        Already have an account?

        <a href="{{ url_for('login_page') }}">

            Login

        </a>

    </p>

</form>

</div>

</div>

</div>

</div>

</div>

</div>

<script src="{{ url_for('static', filename='js/script.js') }}"></script>

<script>

document.getElementById("registerForm").addEventListener("submit", async function(event) {

    event.preventDefault();

    const firstName = document.getElementById("firstname").value.trim();
    const lastName = document.getElementById("lastname").value.trim();
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    const confirmPassword = document.getElementById("confirm_password").value;
    const language = document.getElementById("language").value;

    // Check password confirmation
    if (password !== confirmPassword) {

        alert("Passwords do not match.");

        return;

    }

    const fullName = `${firstName} ${lastName}`.trim();

    try {

        const response = await fetch("/register", {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({

                full_name: fullName,
                email: email,
                password: password,
                language: language

            })

        });


        const result = await response.json();


        if (result.success) {

            alert(result.message || "Registration successful!");

            window.location.href = "/login";

        } else {

            alert(result.message || "Registration failed.");

        }

    } catch (error) {

        console.error("Registration error:", error);

        alert("Unable to connect to the server.");

    }

});

</script>
</body>

</html>
