<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Profile | DIVYA AI</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="stylesheet"
href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

<div class="d-flex">

    <!-- Sidebar -->

    <div class="sidebar">

        <div class="text-center py-4">

            <img src="{{ url_for('static', filename='images/divya-logo.png') }}"
                 class="sidebar-logo"
                 alt="DIVYA AI">

            <h4 class="text-white mt-3">
                DIVYA <span class="text-warning">AI</span>
            </h4>

        </div>

        <ul class="nav flex-column">

            <li><a href="{{ url_for('dashboard') }}"><i class="bi bi-grid-fill"></i> Dashboard</a></li>

            <li><a href="{{ url_for('report_page') }}"><i class="bi bi-exclamation-triangle-fill"></i> Report Incident</a></li>

            <li><a href="{{ url_for('chatbot_page') }}"><i class="bi bi-robot"></i> Ask DIVYA</a></li>

            <li><a href="{{ url_for('recommendation') }}"><i class="bi bi-shield-check"></i> Safety Guidance</a></li>

            <li><a href="{{ url_for('offline') }}"><i class="bi bi-wifi-off"></i> Offline Resources</a></li>

            <li><a href="{{ url_for('profile') }}" class="active"><i class="bi bi-person-circle"></i> Profile</a></li>

        </ul>

    </div>

    <!-- Main Content -->

    <div class="main-content">

        <!-- Top Navbar -->

        <nav class="dashboard-nav">

            <h3>My Profile</h3>

            <button
type="button"
class="btn btn-warning">
                <i class="bi bi-pencil-square"></i>
                Edit Profile
            </button>

        </nav>

        <div class="container-fluid mt-4">

            <div class="row">

                <!-- Left Card -->

                <div class="col-lg-4">

                    <div class="dashboard-card text-center">

                        <img src="{{ url_for('static', filename='images/divya-logo.png') }}"
                             class="profile-avatar mb-3"
                             alt="Profile">

                        <h3>Sharanya Pandey</h3>

                        <p class="text-muted">
                            Registered Citizen
                        </p>

                        <hr>

                        <div class="text-start">

                            <p><i class="bi bi-envelope-fill text-warning"></i> sharanya@email.com</p>

                            <p><i class="bi bi-telephone-fill text-warning"></i> +91 XXXXX XXXXX</p>

                            <p><i class="bi bi-geo-alt-fill text-warning"></i> Lucknow, Uttar Pradesh</p>

                        </div>

                    </div>

                </div>

                <!-- Right Card -->

                <div class="col-lg-8">

                    <div class="dashboard-card">

                        <h4 class="mb-4">Personal Information</h4>

                        <form action="/profile" method="POST">

                            <div class="row">

                                <div class="col-md-6 mb-3">

                                    <label>First Name</label>

                                    <input
                                    type="text"
                                    class="form-control"
                                    name="first_name"
                                    value="Sharanya"
                                    required>

                                </div>

                                <div class="col-md-6 mb-3">

                                    <label>Last Name</label>

                                    <input
type="text"
class="form-control"
name="last_name"
value="Pandey"
required>

                                </div>

                            </div>

                            <div class="mb-3">

                                <label>Email</label>

                                <input
type="email"
class="form-control"
name="email"
value="sharanya@email.com"
required>

                            </div>

                            <div class="mb-3">

                                <label>Phone Number</label>

                                <input
type="text"
class="form-control"
name="phone"
value="+91 XXXXX XXXXX"
required>

                            </div>

                            <div class="mb-3">

                                <label>Preferred Language</label>

                                <select
class="form-select"
name="language">

                                    <option>English</option>

                                    <option>हिन्दी</option>

                                </select>

                            </div>

                            <div class="mb-3">

                                <label>Home Address</label>

                                <textarea
class="form-control"
name="address"
rows="3"
placeholder="Enter Address"></textarea>

                            </div>

                            <button
type="submit"
class="btn btn-warning">

                                <i class="bi bi-save"></i>

                                Save Changes

                            </button>

                        </form>

                    </div>

                </div>

            </div>

            <!-- Emergency Contacts -->

            <div class="dashboard-card mt-4">

                <h4 class="mb-4">

                    <i class="bi bi-person-lines-fill"></i>

                    Emergency Contacts

                </h4>

                <div class="row">

                    <div class="col-md-6">

                        <input
type="text"
class="form-control mb-3"
name="emergency_contact_name"
placeholder="Contact Name">

                    </div>

                    <div class="col-md-6">

                       <input
type="tel"
class="form-control mb-3"
name="emergency_contact_phone"
placeholder="Phone Number">

                    </div>

                </div>

                <button
type="button"
class="btn btn-success">

                    <i class="bi bi-plus-circle"></i>

                    Add Contact

                </button>

            </div>

            <!-- Vulnerability Profile -->

            <div class="dashboard-card mt-4 mb-5">

                <h4 class="mb-4">

                    <i class="bi bi-heart-pulse"></i>

                    Vulnerability Profile

                </h4>

                <div class="row">

                    <div class="col-md-3">

                        <div class="form-check">

                            <input
class="form-check-input"
type="checkbox"
name="vulnerability"
value="elderly">

                            <label class="form-check-label">

                                Elderly

                            </label>

                        </div>

                    </div>

                    <div class="col-md-3">

                        <div class="form-check">

                            <input
class="form-check-input"
type="checkbox"
name="vulnerability"
value="child">

                            <label class="form-check-label">

                                Child

                            </label>

                        </div>

                    </div>

                    <div class="col-md-3">

                        <div class="form-check">

                            <input
class="form-check-input"
type="checkbox"
name="vulnerability"
value="disability">

                            <label class="form-check-label">

                                Disability

                            </label>

                        </div>

                    </div>

                    <div class="col-md-3">

                        <div class="form-check">

                            <input
class="form-check-input"
type="checkbox"
name="vulnerability"
value="chronic_illness">

                            <label class="form-check-label">

                                Chronic Illness

                            </label>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>

<script src="{{ url_for('static', filename='js/script.js') }}"></script>

</body>

</html>
